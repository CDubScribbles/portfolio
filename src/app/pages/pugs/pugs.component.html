<section class="container page">
  <p class="eyebrow">Pugs</p>
  <h1>My story</h1>
  <p class="lead">
    As dramatized by the ineffable {{ mascotName }}, mascot of all things
    dramatic and adventurous.
  </p>

  <ol class="story">
    @for (chapter of chapters; track chapter.id; let i = $index) {
      <li class="chapter" [class.flip]="i % 2 === 1" [attr.data-shape]="chapter.shape">
        <figure>
          <div class="frame">
            <img
              [src]="src(chapter)"
              [attr.srcset]="srcset(chapter)"
              [attr.sizes]="sizes(chapter)"
              [attr.width]="chapter.width"
              [attr.height]="chapter.height"
              [attr.loading]="i === 0 ? null : 'lazy'"
              decoding="async"
              [alt]="chapter.alt"
            />
          </div>
          <figcaption>
            <span class="number" aria-hidden="true">{{ i + 1 < 10 ? '0' : '' }}{{ i + 1 }}</span>
            <span class="text">{{ chapter.caption }}</span>
          </figcaption>
        </figure>
      </li>
    }
  </ol>

  <p class="outro">
    <a class="button" routerLink="/resume">Read the grown-up version</a>
  </p>
</section>
